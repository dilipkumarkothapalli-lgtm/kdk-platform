<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KDK Premium Ecosystem - Music Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.10/hls.min.js"></script>
    <style>
        :root { --bg-deep: #050505; --bg-light: #0a1f3d; --glow-cyan: #00e5ff; --pink-glow: #ff007f; --primary: #00B597; --nav-width: 90px; --text-muted: #9ca3af; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at top center, var(--bg-light) 0%, var(--bg-deep) 100%); background-attachment: fixed; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; display: flex; min-height: 100vh; }
        ::-webkit-scrollbar { display: none; }
        *:focus { outline: none !important; }
        .focusable { transition: 0.2s ease; border: 2px solid transparent; outline: none; cursor: pointer; border-radius: 12px; }
        .focusable:focus, .focusable.active-focus, .focusable:hover { border-color: var(--glow-cyan) !important; background-color: rgba(0, 229, 255, 0.1); transform: scale(1.05); z-index: 10; box-shadow: 0 0 15px var(--glow-cyan); }
        .side-nav { width: var(--nav-width); height: 100vh; position: fixed; left: 0; top: 0; background: rgba(2, 8, 19, 0.85); backdrop-filter: blur(20px); border-right: 1px solid rgba(0,229,255,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9000; }
        .nav-center-group { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 64px; height: 64px; color: #8b9bb4; text-decoration: none; border-radius: 16px; position: relative; }
        .nav-item span { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; margin-top: 4px; opacity: 0; }
        .nav-item.active { color: #fff; background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(255,0,127,0.2)); border: 1px solid var(--glow-cyan); box-shadow: 0 0 15px rgba(255,0,127,0.4); }
        .nav-item.active span { opacity: 1; }
        .main-wrapper { margin-left: var(--nav-width); width: calc(100% - var(--nav-width)); display: flex; flex-direction: column; padding-bottom: 90px; min-height: 100vh; }
        .top-header { width: 100%; padding: 20px 4%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 150; background: rgba(2,8,19,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,229,255,0.1); }
        .logo-container { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,229,255,0.2); padding: 5px 15px; border-radius: 12px; }
        .logo-container img { height: 40px; }
        .logo-text { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, var(--glow-cyan), var(--pink-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        main { padding: 20px 4%; flex: 1; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 20px; }
        .section-title { font-size: 1.5rem; font-weight: 700; }
        .scroll-container { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scroll-behavior: smooth; }
        .card { min-width: 150px; width: 150px; flex-shrink: 0; border-radius: 12px; }
        .card-img-wrapper { width: 100%; aspect-ratio: 1; position: relative; border-radius: 10px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 10px 4px 0; }
        .card-title { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;}
        .card-sub { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 40px; z-index: 8500; transform: translateY(150%); transition: 0.3s; }
        .player-bar.active { transform: translateY(0); }
        .np-art { width: 56px; height: 56px; border-radius: 6px; margin-right: 15px; }
        .np-info { flex-grow: 1; }
        .np-title { font-weight: 600; color: white; }
        .np-artist { font-size: 0.85rem; color: var(--text-muted); }
        .btn-play-mini { width: 45px; height: 45px; background: white; color: black; border-radius: 50%; border: none; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .side-nav { width: 100%; height: 85px; flex-direction: row; border-top: 2px solid var(--glow-cyan); top: auto; bottom: 0; border-radius: 25px 25px 0 0; }
            .nav-center-group { flex-direction: row; justify-content: space-around; padding-bottom: 10px; }
            .nav-item { width: 55px; height: 55px; margin: 0; }
            .main-wrapper { margin-left: 0; padding-bottom: 180px; }
            .player-bar { bottom: 95px; width: calc(100% - 30px); left: 15px; border-radius: 16px; padding: 0 15px; }
        }
    </style>
</head>
<body>
    <nav class="side-nav"><div class="nav-center-group" id="dynamicNavContainer"></div></nav>
    <div class="main-wrapper">
        <div class="top-header">
            <div class="search-section"><div class="global-search focusable" tabindex="0"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search Music..."></div></div>
            <div class="logo-section focusable" tabindex="0" onclick="loadHome()"><div class="logo-container"><span class="logo-text">KDK MUSIC</span></div></div>
            <div style="flex:1; display:flex; justify-content:flex-end;"><button class="focusable" tabindex="0" onclick="toggleModal('heroLanguagePickerModal')" style="background:transparent; border:1px solid var(--glow-cyan); color:#fff; padding:10px 20px; border-radius:20px;">Radio Stations</button></div>
        </div>
        <main id="mainContent"><div style="text-align:center; padding:60px;">Loading Server...</div></main>
    </div>

    <div id="heroLanguagePickerModal" style="display:none; position: fixed; inset: 0; background: rgba(2,8,19,0.96); z-index: 99999; justify-content: center; align-items: center; flex-direction:column;">
        <h2 style="color:var(--glow-cyan); font-size:2rem; font-weight:900; margin-bottom:30px;">Select Regional Radio</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; width:90%; max-width:500px; margin-bottom:30px;">
            <div class="focusable" tabindex="0" onclick="fetchWebStream('TEL')" style="background:rgba(255,255,255,0.1); border:1px solid var(--glow-cyan); padding:20px; text-align:center; border-radius:12px; font-weight:bold;">Telugu Radio</div>
            <div class="focusable" tabindex="0" onclick="fetchWebStream('HIN')" style="background:rgba(255,255,255,0.1); border:1px solid var(--glow-cyan); padding:20px; text-align:center; border-radius:12px; font-weight:bold;">Hindi Radio</div>
            <div class="focusable" tabindex="0" onclick="fetchWebStream('ENG')" style="background:rgba(255,255,255,0.1); border:1px solid var(--glow-cyan); padding:20px; text-align:center; border-radius:12px; font-weight:bold;">English Hits</div>
            <div class="focusable" tabindex="0" onclick="fetchWebStream('TAM')" style="background:rgba(255,255,255,0.1); border:1px solid var(--glow-cyan); padding:20px; text-align:center; border-radius:12px; font-weight:bold;">Tamil Beats</div>
        </div>
        <button class="focusable" tabindex="0" onclick="toggleModal('')" style="background:rgba(255,0,127,0.5); border:none; padding:10px 30px; color:#fff; border-radius:8px;">Close</button>
    </div>

    <div class="player-bar" id="playerBar">
        <div id="progressFill" style="position:absolute; top:0; left:0; height:4px; background:var(--pink-glow); width:0%;"></div>
        <img src="" class="np-art" id="npArt">
        <div class="np-info"><div class="np-title" id="npTitle">Loading...</div><div class="np-artist" id="npArtist">Please Wait</div></div>
        <div style="display:flex; gap:15px;">
            <button class="btn-play-mini focusable" tabindex="0" onclick="togglePlay()"><i id="playIcon" class="ri-play-fill"></i><i id="pauseIcon" class="ri-pause-fill hidden"></i></button>
        </div>
    </div>
    
    <div id="globalEcosystemPlayer" style="display:none; position:fixed; inset:0; background:#000; z-index:100000;">
        <button class="focusable" tabindex="0" onclick="document.getElementById('globalEcosystemPlayer').style.display='none'; document.getElementById('playerRenderField').innerHTML='';" style="position:absolute; top:30px; left:30px; z-index:100; background:rgba(0,0,0,0.5); color:#fff; border:1px solid #fff; padding:10px 20px; border-radius:8px;">← Close Radio</button>
        <div id="playerRenderField" style="width:100%; height:100%;"></div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

<script>
    const API_BASE = 'https://nepotuneapi.vercel.app/api';
    let currentPlaylist = [], currentIndex = 0;
    const audio = document.getElementById('audioPlayer');
    
    window.addEventListener('load', () => { initCircularNav(); loadHome(); initRemote(); });

    function initCircularNav() {
        const c = document.getElementById('dynamicNavContainer');
        const arr = [{ id: 'nav-music', icon: 'fa-music', text: 'Music', intent: 'music.html', active: true }, { id: 'nav-sports', icon: 'fa-trophy', text: 'Sports', intent: 'sports.html', active: false }, { id: 'nav-home', icon: 'fa-home', text: 'Home', intent: 'index.html', active: false }, { id: 'nav-tv', icon: 'fa-tv', text: 'Live TV', intent: 'tv.html', active: false }, { id: 'nav-movies', icon: 'fa-film', text: 'Movies', intent: 'movies.html', active: false }];
        c.innerHTML = arr.map((item, i) => `<a href="${item.intent}" id="${item.id}" class="nav-item ${item.active ? 'active' : ''} focusable" tabindex="0" style="order: ${i};"><i class="fas ${item.icon}"></i><span>${item.text}</span></a>`).join('');
    }

    function toggleModal(id) { document.getElementById('heroLanguagePickerModal').style.display = id ? 'flex' : 'none'; initRemote(); }

    async function fetchSongs(query) {
        try {
            const res = await fetch(`${API_BASE}/search/songs?query=${encodeURIComponent(query)}&limit=20`);
            const json = await res.json();
            return json.data.results.map(t => ({ id: t.id, title: t.name, artist: t.artists?.primary?.[0]?.name || 'Unknown', image: t.image.find(i=>i.quality==='500x500')?.url || t.image[0].url, url: t.downloadUrl.find(x=>x.quality==='320kbps')?.url || t.downloadUrl[0].url }));
        } catch(e){ return []; }
    }

    async function loadHome() {
        const mc = document.getElementById('mainContent');
        mc.innerHTML = `<div class="section-header"><h2 class="section-title">Trending Hits</h2></div><div class="scroll-container" id="s1"></div>
                        <div class="section-header"><h2 class="section-title">Melody Vibes</h2></div><div class="scroll-container" id="s2"></div>`;
        const [hits, melody] = await Promise.all([fetchSongs("latest telugu hit songs"), fetchSongs("melody chill telugu")]);
        renderCards(hits, document.getElementById('s1')); renderCards(melody, document.getElementById('s2'));
    }

    function renderCards(items, container) {
        container.innerHTML = items.map((item, i) => `
            <div class="card focusable" tabindex="0" onclick='playSong(${JSON.stringify(item).replace(/'/g, "&apos;")}, ${JSON.stringify(items).replace(/'/g, "&apos;")})'>
                <div class="card-img-wrapper"><img src="${item.image}" class="card-img"></div>
                <div class="card-info"><div class="card-title">${item.title}</div><div class="card-sub">${item.artist}</div></div>
            </div>
        `).join('');
        initRemote();
    }

    function playSong(song, list) {
        currentPlaylist = list; currentIndex = list.findIndex(s => s.id === song.id);
        document.getElementById('playerBar').classList.add('active');
        document.getElementById('npTitle').innerText = song.title;
        document.getElementById('npArtist').innerText = song.artist;
        document.getElementById('npArt').src = song.image;
        audio.src = song.url; audio.play(); document.getElementById('playIcon').classList.add('hidden'); document.getElementById('pauseIcon').classList.remove('hidden');
    }

    function togglePlay() { 
        if(audio.paused) { audio.play(); document.getElementById('playIcon').classList.add('hidden'); document.getElementById('pauseIcon').classList.remove('hidden'); }
        else { audio.pause(); document.getElementById('playIcon').classList.remove('hidden'); document.getElementById('pauseIcon').classList.add('hidden'); }
    }
    audio.addEventListener('timeupdate', () => { if(audio.duration) document.getElementById('progressFill').style.width = `${(audio.currentTime / audio.duration)*100}%`; });
    audio.addEventListener('ended', () => { if(currentIndex < currentPlaylist.length -1) playSong(currentPlaylist[currentIndex+1], currentPlaylist); });

    // WEB API ENGINE
    const WEB_SHEET_API = "https://docs.google.com/spreadsheets/d/1bvPxXCGQ6kdTCoUB1xMAodT5tgC_-_J84_G_LhnV3NQ/gviz/tq?tqx=out:json&sheet=WEB";
    async function fetchWebStream(code) {
        toggleModal(''); 
        try {
            const res = await fetch(WEB_SHEET_API); const text = await res.text();
            const json = JSON.parse(text.substring(47).slice(0, -2));
            let foundRow = json.table.rows.find(r => r.c[0] && r.c[0].v.toString().trim().toUpperCase() === code.toUpperCase());
            if(foundRow && foundRow.c[2] && foundRow.c[2].v) {
                const streamUrl = foundRow.c[2].v.toString().trim();
                document.getElementById('globalEcosystemPlayer').style.display='block';
                const render = document.getElementById('playerRenderField');
                if(streamUrl.endsWith('.mp4') || streamUrl.includes('.m3u8')) {
                    render.innerHTML = `<video id="radioVideo" controls autoplay style="width:100%; height:100%; background:#000;"></video>`;
                    const video = document.getElementById('radioVideo');
                    if (streamUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
                        let hlsLocal = new Hls(); hlsLocal.loadSource(streamUrl); hlsLocal.attachMedia(video);
                    } else { video.src = streamUrl; }
                } else {
                    render.innerHTML = `<iframe src="${streamUrl}" allow="autoplay; fullscreen" style="width:100%; height:100%; border:none;"></iframe>`;
                }
                audio.pause(); togglePlay();
            } else { alert("Stream temporarily unavailable for " + code); }
        } catch(e) { console.error(e); alert("Database Error."); }
    }

    // Remote Logic
    let focusNodes=[], fIdx=0;
    function initRemote() { focusNodes = Array.from(document.querySelectorAll(document.getElementById('heroLanguagePickerModal').style.display==='flex' ? '#heroLanguagePickerModal .focusable' : '.focusable')).filter(e=>e.offsetHeight>0); }
    document.addEventListener('keydown', e => {
        if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) { e.preventDefault(); if(focusNodes.length===0)return; fIdx = (e.key==='ArrowRight'||e.key==='ArrowDown') ? (fIdx+1)%focusNodes.length : (fIdx-1+focusNodes.length)%focusNodes.length; focusNodes.forEach(n=>n.classList.remove('active-focus')); focusNodes[fIdx].focus(); focusNodes[fIdx].classList.add('active-focus'); focusNodes[fIdx].scrollIntoView({behavior:'smooth',block:'center'}); }
        if(e.key==='Enter' && document.activeElement.classList.contains('focusable')) document.activeElement.click();
    });
</script>
</body>
</html>
